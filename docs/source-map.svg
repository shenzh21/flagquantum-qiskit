<text x="143" y="854" font-size="28" fill="#1C263A" font-weight="650" text-anchor="start">noise.py</text>
<text x="143" y="891" font-size="22" fill="#58677E" font-weight="400" text-anchor="start">提前转换噪声规则。</text>
<path d="M95 1007H117" fill="none" stroke="#3154E8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="95" cy="1007" r="5" fill="#3154E8"/>
<rect x="120" y="957" width="410" height="100" rx="16" fill="#FFFFFF" stroke="#D7DEEC" stroke-width="1.5"/>
<text x="143" y="994" font-size="28" fill="#1C263A" font-weight="650" text-anchor="start">conversion.py</text>
<text x="143" y="1031" font-size="22" fill="#58677E" font-weight="400" text-anchor="start">转换线路，保留附带信息。</text>
<path d="M595 587H617" fill="none" stroke="#3154E8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="595" cy="587" r="5" fill="#3154E8"/>
<rect x="620" y="537" width="410" height="100" rx="16" fill="#FFFFFF" stroke="#D7DEEC" stroke-width="1.5"/>
<text x="643" y="574" font-size="28" fill="#1C263A" font-weight="650" text-anchor="start">program.py</text>
<text x="643" y="611" font-size="22" fill="#58677E" font-weight="400" text-anchor="start">把通用线路整理成步骤。</text>
<path d="M595 727H617" fill="none" stroke="#3154E8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="595" cy="727" r="5" fill="#3154E8"/>
<rect x="620" y="677" width="410" height="100" rx="16" fill="#FFFFFF" stroke="#D7DEEC" stroke-width="1.5"/>
<text x="643" y="714" font-size="28" fill="#1C263A" font-weight="650" text-anchor="start">engine.py</text>
<text x="643" y="751" font-size="22" fill="#58677E" font-weight="400" text-anchor="start">运行标准门的末尾采样。</text>
<path d="M595 867H617" fill="none" stroke="#3154E8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="595" cy="867" r="5" fill="#3154E8"/>
<rect x="620" y="817" width="410" height="100" rx="16" fill="#FFFFFF" stroke="#D7DEEC" stroke-width="1.5"/>
<text x="643" y="854" font-size="28" fill="#1C263A" font-weight="650" text-anchor="start">trajectory.py</text>
<text x="643" y="891" font-size="22" fill="#58677E" font-weight="400" text-anchor="start">执行动态、保存和噪声等。</text>
<path d="M1095 587H1117" fill="none" stroke="#3154E8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="1095" cy="587" r="5" fill="#3154E8"/>
<rect x="1120" y="537" width="410" height="100" rx="16" fill="#FFFFFF" stroke="#D7DEEC" stroke-width="1.5"/>
<text x="1143" y="574" font-size="28" fill="#1C263A" font-weight="650" text-anchor="start">results.py</text>
<text x="1143" y="611" font-size="22" fill="#58677E" font-weight="400" text-anchor="start">只整理末尾采样路径的结果。</text>
<path d="M1095 727H1117" fill="none" stroke="#3154E8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="1095" cy="727" r="5" fill="#3154E8"/>
<rect x="1120" y="677" width="410" height="100" rx="16" fill="#FFFFFF" stroke="#D7DEEC" stroke-width="1.5"/>
<text x="1143" y="714" font-size="28" fill="#1C263A" font-weight="650" text-anchor="start">job.py</text>
<text x="1143" y="751" font-size="22" fill="#58677E" font-weight="400" text-anchor="start">包装已完成结果，供用户读取。</text>
<text x="620" y="1001" font-size="23" fill="#58677E" font-weight="400" text-anchor="start">另一条路径的结果，</text>
<text x="620" y="1034" font-size="23" fill="#58677E" font-weight="400" text-anchor="start">由 trajectory 收集、backend 组装。</text>
<text x="1120" y="863" font-size="21" fill="#3154E8" font-weight="600" text-anchor="start">这些箭头都来自 backend。</text>
<text x="1120" y="899" font-size="21" fill="#58677E" font-weight="400" text-anchor="start">例如：engine 不调用 results，</text>
<text x="1120" y="931" font-size="21" fill="#58677E" font-weight="400" text-anchor="start">是 backend 分别调用它们。</text>
<rect x="70" y="1130" width="940" height="141" rx="16" fill="#FFFFFF" stroke="#D7DEEC" stroke-width="1.5"/>
<text x="93" y="1167" font-size="28" fill="#1C263A" font-weight="650" text-anchor="start">contracts.py · 共享数据格式</text>
<text x="93" y="1204" font-size="22" fill="#58677E" font-weight="400" text-anchor="start">validation、conversion、engine、results 使用这里的数据类型。</text>
<text x="93" y="1234" font-size="22" fill="#58677E" font-weight="400" text-anchor="start">它是大家共用的“表格格式”，不是一个执行步骤。</text>
<rect x="1050" y="1130" width="480" height="141" rx="16" fill="#FFFFFF" stroke="#D7DEEC" stroke-width="1.5"/>
<text x="1073" y="1167" font-size="28" fill="#1C263A" font-weight="650" text-anchor="start">fq_ops.py · 二级协作</text>
<text x="1073" y="1204" font-size="22" fill="#58677E" font-weight="400" text-anchor="start">由 program 和 trajectory 使用。</text>
<text x="1073" y="1234" font-size="22" fill="#58677E" font-weight="400" text-anchor="start">具体调用关系见第二张图。</text>
<rect x="70" y="1310" width="1460" height="66" rx="16" fill="#E7F2ED" stroke="#C8E2D5" stroke-width="1.5"/>
<text x="95" y="1353" font-size="25" fill="#216B55" font-weight="600" text-anchor="start">真正的量子计算来自外部 FlagQuantum；本包负责转换、调度和整理结果。</text>
</g></svg>
