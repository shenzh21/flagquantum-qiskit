<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800" role="img" aria-labelledby="title description">
<title id="title">FlagQuantum Qiskit 后端：目录、执行流程与已实现能力</title>
<desc id="description">0.2.0 版本架构图。三个独立目录分别保存 Qiskit 研究、FlagQuantum 上游研究与可发布适配器。Qiskit 转译后仍是 QuantumCircuit，经 Backend 校验后进入理想末端采样或动态噪声保存路径，两者均调用外部 FlagQuantum 数值引擎。适配器负责经典调度、表示转换与结果映射，不重写量子模拟器。Aer 仅为可选对象来源与测试参考。</desc>
